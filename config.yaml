# config.yaml

# DATA, DATASET
base_data_path: "../../data"
datasets:

# INPUT
num_pkts: 20
fields: ['PL', 'IAT', 'DIR', 'WIN', 'FLG', 'TTL']
all_fields: ['PL', 'IAT', 'DIR', 'WIN', 'FLG', 'TTL']
return_quintuple: # Set True only for xai
is_flat: False
pad_value_dir: 0.5
pad_value: &pad_value -1
train_test_split: 0.7
train_val_split: 0.9
scaler: 'minmax_symlog' # 'minmax_symlog' or 'minmax'
linear_fraction: 0.7
symlog_params:
  PL:  [*pad_value, 1500 , 65535]
  IAT: [*pad_value, 60000000]
  DIR: [0, 1]
  WIN: [*pad_value, 65535]
  FLG: [*pad_value, 255]
  TTL: [*pad_value, 255]

# EXPERIMENT
seed: 0
gpu: False
n_thr:
deterministic: True
benchmark: False
log_dir: "../results"
approach:
ckpt_path: 
skip_t1:
skip_t2:

# DL TRAINING
lr: 0.0001
optimizer: 'adam'
sgd_params:
  momentum: 0.9
  weight_decay: 0.001
  nesterov: True
max_epochs: 100
min_epochs: 1
adapt_strat: 'finetuning' 
adapt_lr: 0.0001
adapt_epochs: 100

# LR SCHEDULER
lr_strat: 'none'
sch_monitor: 'loss'
lrop_mode: 'min'
lrop_factor: 0.1
lrop_patience: 5
cawr_t0: 10
cawr_t_mult: 1
cawr_eta_min: 1e-5

# EARLY STOPPING
es_monitor: 'loss'
es_mode: 'min'
es_patience: 10
es_min_delta: 0

# MODEL CHECKPOINT
mc_monitor: 'loss'
mc_mode: 'min'

# DATALOADER
batch_size: 64
adapt_batch_size: 64
num_workers: 0
pin_memory:

# DL NETWORK
network: '2dcnn'
net_scale: 1
num_classes: 0

# FEW-SHOT LEARNING
is_fsl:
k_seed: 0
test_k:

# RFS
alpha: 0.5
gamma: 0.5
is_distill:
kd_t: 1
teacher_path:

# NEGATIVE MARGIN
nm_margin: -0.3
nm_inner_margin: 0.0
nm_temp: 30.0
nm_inner_temp: 5.0

# RANDOM FOREST
rf_criterion: 'gini'
rf_n_estimators: 100
rf_max_depth:

# XGB
xgb_n_estimators: 100
xgb_max_depth: 3
xgb_eval_metric: 'mlogloss'

# KNN
knn_n_neighbors: 5
knn_weights: 'uniform'
knn_p: 2
knn_metric: 'minkowski'
